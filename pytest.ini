[pytest]
testpaths = services/evaluator/tests services/stages/tests tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: marks tests as requiring live services (deselect with -m "not live")
    integration: marks integration tests requiring running Docker stack
    unit: marks pure unit tests with no external dependencies
addopts = -v --tb=short
