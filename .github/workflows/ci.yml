name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Next.js / TypeScript ──────────────────────────────────────────────────
  nextjs:
    name: Next.js lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: npx vitest run --reporter=verbose
        env:
          NODE_ENV: test

  # ── Python pipeline service ───────────────────────────────────────────────
  python:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadscope_test
          POSTGRES_PASSWORD: leadscope_test
          POSTGRES_DB: leadscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/stages/requirements.txt

      - name: Cache Playwright Browsers
        id: playwright-python-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-python-${{ hashFiles('services/stages/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-python-

      - name: Install Python deps
        run: |
          pip install -r services/stages/requirements.txt
          pip install pytest pytest-asyncio pytest-mock playwright

      - name: Install Playwright browsers (Python)
        if: steps.playwright-python-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps
      - name: Install Playwright system deps (Python)
        if: steps.playwright-python-cache.outputs.cache-hit == 'true'
        run: playwright install-deps

      - name: Apply DB schema
        run: psql postgresql://leadscope_test:leadscope_test@localhost:5432/leadscope_test -f db/schema.sql

      - name: Run unit tests
        run: pytest tests/unit/ services/evaluator/tests/ services/stages/tests/ services/crawler/tests/ services/jobs/tests/ -v
        env:
          PYTHONPATH: services/stages:services/evaluator:services/crawler
          DATABASE_URL: postgresql://leadscope_test:leadscope_test@localhost:5432/leadscope_test

      - name: Run sub-project tests
        run: |
          cd seo-spam-hunter && pytest tests/ -v && cd ..
          cd wp-hunter && pytest tests/ -v && cd ..

      - name: Run integration tests
        run: pytest tests/integration/ -v
        env:
          DATABASE_URL: postgresql://leadscope_test:leadscope_test@localhost:5432/leadscope_test
          GEMINI_PROXY_API_KEY: dummy
          GEMINI_PROXY_ENDPOINT: http://localhost:9999
          PYTHONPATH: services/stages:services/evaluator:services/crawler

  # ── Playwright E2E (smoke only) ───────────────────────────────────────────
  e2e:
    name: Playwright E2E smoke
    runs-on: ubuntu-latest
    needs: [nextjs]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:3000
          NODE_ENV: test
