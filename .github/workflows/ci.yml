name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Next.js / TypeScript ──────────────────────────────────────────────────
  nextjs:
    name: Next.js lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: npx vitest run --reporter=verbose
        env:
          NODE_ENV: test

  # ── Python pipeline service ───────────────────────────────────────────────
  python:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadscope_test
          POSTGRES_PASSWORD: leadscope_test
          POSTGRES_DB: leadscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/stages/requirements.txt

      - name: Install Python deps
        run: |
          pip install -r services/stages/requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Apply DB schema
        run: psql postgresql://leadscope_test:leadscope_test@localhost:5432/leadscope_test -f db/schema.sql

      - name: Run unit tests
        run: pytest tests/unit/ -v
        env:
          PYTHONPATH: services/stages:services/evaluator

      - name: Run integration tests
        run: pytest tests/integration/ -v
        env:
          DATABASE_URL: postgresql://leadscope_test:leadscope_test@localhost:5432/leadscope_test
          GEMINI_PROXY_API_KEY: dummy
          GEMINI_PROXY_ENDPOINT: http://localhost:9999
          PYTHONPATH: services/stages:services/evaluator

  # ── Playwright E2E (smoke only) ───────────────────────────────────────────
  e2e:
    name: Playwright E2E smoke
    runs-on: ubuntu-latest
    needs: [nextjs]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:3000
          NODE_ENV: test
