services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 15s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - N8N_EXPRESSIONS_ALLOWED_ENV_VARS=INTERNAL_API_TOKEN
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  gemini-proxy:
    image: zhu327/gemini-openai-proxy:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8045:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health 2>/dev/null || curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  evaluator:
    build:
      context: .
      dockerfile: services/evaluator/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
      GEMINI_PROXY_ENDPOINT: http://gemini-proxy:8080
      CRAWLER_ENDPOINT: http://crawler:8003
    depends_on:
      postgres:
        condition: service_healthy
      gemini-proxy:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  stages:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL and proxy endpoints to use Docker service/host names
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
      GEMINI_PROXY_ENDPOINT: http://gemini-proxy:8080
      OLLAMA_HOST: ${OLLAMA_HOST}
      CRAWLER_ENDPOINT: http://crawler:8003
    depends_on:
      postgres:
        condition: service_healthy
      crawler:
        condition: service_healthy
      gemini-proxy:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    env_file:
      - .env
    environment:
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET}
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
      GEMINI_PROXY_ENDPOINT: http://gemini-proxy:8080
    depends_on:
      postgres:
        condition: service_healthy
      gemini-proxy:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/app

  job-budget-monitor:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    profiles:
      - jobs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./services/jobs:/app/jobs
    command: ["python", "/app/jobs/budget_monitor.py"]
    depends_on:
      postgres:
        condition: service_healthy

  job-icp-drift:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    profiles:
      - jobs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./services/jobs:/app/jobs
      - ./services/evaluator:/app/evaluator
    command: ["python", "/app/jobs/icp_drift_job.py"]
    depends_on:
      postgres:
        condition: service_healthy

  job-malwarebazaar-monitor:
    build:
      context: .
      dockerfile: services/evaluator/Dockerfile
    profiles:
      - jobs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./services/jobs:/app/jobs
    command: ["python", "/app/jobs/malwarebazaar_monitor.py"]
    depends_on:
      postgres:
        condition: service_healthy



  job-rescore-icp:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    profiles:
      - jobs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EVALUATOR_HOST: evaluator:8001
    volumes:
      - ./services/jobs:/app/jobs
    command: ["python", "/app/jobs/rescore_icp.py"]
    depends_on:
      postgres:
        condition: service_healthy

  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    ports:
      - "8047:3000"
    environment:
      - CONNECTION_TIMEOUT=300000
      - MAX_CONCURRENT_SESSIONS=25
      - DEFAULT_IGNORE_HTTPS_ERRORS=true
      - TIMEOUT=60000

volumes:
  postgres_data:
  n8n_data:
  app_logs:
