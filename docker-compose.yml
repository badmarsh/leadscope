services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 15s
      retries: 10

  evaluator:
    build:
      context: .
      dockerfile: services/evaluator/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
      GEMINI_PROXY_ENDPOINT: http://host.docker.internal:8045
      CRAWLER_ENDPOINT: http://crawler:8003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  stages:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL and proxy endpoints to use Docker service/host names
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
      GEMINI_PROXY_ENDPOINT: http://host.docker.internal:8045
      OLLAMA_HOST: ${OLLAMA_HOST}
      CRAWLER_ENDPOINT: http://crawler:8003
    depends_on:
      postgres:
        condition: service_healthy
      crawler:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    env_file:
      - .env
    environment:
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET}
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY}
      GEMINI_PROXY_ENDPOINT: http://host.docker.internal:8045
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/app
      - screenshot_cache:/data/screenshots
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/session').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  job-budget-monitor:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    profiles:
      - jobs
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./services/jobs:/app/jobs
    command: ["python", "/app/jobs/budget_monitor.py"]
    depends_on:
      postgres:
        condition: service_healthy

  job-icp-drift:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    profiles:
      - jobs
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./services/jobs:/app/jobs
      - ./services/evaluator:/app/evaluator
    command: ["python", "/app/jobs/icp_drift_job.py"]
    depends_on:
      postgres:
        condition: service_healthy

  job-malwarebazaar-monitor:
    build:
      context: .
      dockerfile: services/evaluator/Dockerfile
    profiles:
      - jobs
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./services/jobs:/app/jobs
    command: ["python", "/app/jobs/malwarebazaar_monitor.py"]
    depends_on:
      postgres:
        condition: service_healthy

  job-rescore-icp:
    build:
      context: .
      dockerfile: services/stages/Dockerfile
    profiles:
      - jobs
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EVALUATOR_HOST: evaluator:8001
    volumes:
      - ./services/jobs:/app/jobs
    command: ["python", "/app/jobs/rescore_icp.py"]
    depends_on:
      postgres:
        condition: service_healthy

  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8047:3000"   # security: bind to localhost only (was 0.0.0.0)
    environment:
      - TOKEN=${BROWSERLESS_TOKEN:-dev_browserless_token_change_in_prod}
      - CONNECTION_TIMEOUT=300000
      - MAX_CONCURRENT_SESSIONS=40
      - PREVENT_REJECT=true
      - MAX_QUEUE_LENGTH=100
      - QUEUED_TIMEOUT=60000
      - IGNORE_HTTPS_ERRORS=true
      - TIMEOUT=30000

volumes:
  postgres_data:
  app_logs:
  screenshot_cache:

